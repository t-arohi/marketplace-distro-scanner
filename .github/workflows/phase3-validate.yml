name: Phase 3 - Validate AzNFS with LISA

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Run automatically after Phase 2 finishes (it produces lisa_jobs.json).
  # `workflow_run` only fires for workflow files on the default branch.
  workflow_run:
    workflows: ["Phase 2 - Validate against PMC prod"]
    types: [completed]
  workflow_dispatch:
    # Manual trigger: re-run validation against the latest Phase 2 hand-off.

# IMPORTANT: shared with Phase 2. Phase 2 AND Phase 3 both mutate the same
# marketplace.db cache, so they MUST serialize under ONE concurrency group to
# avoid clobbering each other's writes (last-writer-wins on the cache).
concurrency:
  group: marketplace-db
  cancel-in-progress: false

jobs:
  validate:
    # When triggered by Phase 2, only proceed if Phase 2 actually succeeded.
    # (A manual workflow_dispatch has no upstream conclusion, so allow it too.)
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - azure-vm-marketplace

    permissions:
      # A job-level block replaces the defaults, so every scope this job needs
      # must be listed. actions:write is what lets the final "Save database
      # cache" step reserve a cache -- without it every verdict recorded below
      # is written to marketplace.db and then thrown away.
      actions: write
      contents: write

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout source
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Restore the shared SQLite DB (most recent, via the prefix key).
      #    Phase 3 updates each validated distro's row, then re-saves the
      #    cache under the same prefix so the next run sees it.
      # ----------------------------------------------------------------
      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: marketplace.db
          key: marketplace-db-v2-${{ github.run_id }}
          restore-keys: |
            marketplace-db-v2-

      # ----------------------------------------------------------------
      # 3. Fetch Phase 2's hand-off (lisa_jobs.json).
      #    On workflow_run we pull the artifact the triggering Phase 2 run
      #    uploaded; on manual dispatch we fall back to the most recent
      #    successful Phase 2 run's artifact.
      # ----------------------------------------------------------------
      - name: Download Phase 2 output (from triggering run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: lisa-jobs-${{ github.event.workflow_run.run_number }}
          path: output
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Download latest Phase 2 output (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: phase2-publish.yml
          workflow_conclusion: success
          name_is_regexp: true
          name: lisa-jobs-.*
          path: output
          if_no_artifact_found: fail

      # ----------------------------------------------------------------
      # 4. Ensure the LISA engine is installed on the runner (idempotent).
      #    First run does the full apt + clone + pip install (~minutes); later
      #    runs are a no-op fast-path when the venv already exists. Skip the
      #    bootstrap entirely by pre-installing LISA and setting LISA_VENV.
      # ----------------------------------------------------------------
      - name: Ensure LISA engine
        env:
          LISA_VENV: ${{ vars.LISA_VENV }}
          # Set the LISA_REF repo variable to a SHA to freeze the engine while
          # chasing a regression; unset it to follow upstream main again.
          LISA_REF: ${{ vars.LISA_REF }}
          # actions/checkout leaves a github.com auth header carrying THIS repo's
          # token, which outranks the runner's own credential and 404s on the
          # private engine repo. Cleared for this step only -- via env, so pip's
          # child git sees it too, and the repo config stays intact for the
          # STATUS.md push later on.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: ""
        run: |
          set -euo pipefail
          VENV="${LISA_VENV:-$HOME/lisa-venv}"
          REPO="https://github.com/Azure/azfiles-lisa.git"
          REF="${LISA_REF:-main}"

          # Resolve upstream only when git is here. setup_lisa.sh's apt step is
          # best-effort (it needs sudo), so it cannot be relied on to supply git
          # -- but pip needs it to clone, and that failure is loud and specific.
          WANT=""
          RESOLVE_ERR=""
          if command -v git >/dev/null 2>&1; then
            # Every part best-effort: this path exists so a failed lookup cannot
            # stop Phase 3, and it would be self-defeating for the error capture
            # itself to abort the step under set -e.
            ERR_FILE="${RUNNER_TEMP:-/tmp}/lisa_ref.err"
            if ! WANT=$(bash phase3/resolve_lisa_ref.sh "$REPO" "$REF" 2>"$ERR_FILE"); then
              WANT=""
              RESOLVE_ERR=$(tail -n 1 "$ERR_FILE" 2>/dev/null || true)
              # Distinct from the git-absent case below, which reads "no git".
              [ -n "$RESOLVE_ERR" ] || RESOLVE_ERR="lookup failed, reason unavailable"
            fi
          fi
          # Compare commit to commit: pip records the URL it cloned, so a plain
          # substring test could match on any part of it. Missing venv is fine --
          # HAVE is empty and we bootstrap.
          HAVE=$("$VENV/bin/pip" freeze 2>/dev/null | grep -i mslisa || true)
          HAVE_SHA=$(printf '%s' "$HAVE" | sed -n 's/.*@\([0-9a-fA-F]\{7,40\}\).*/\1/p' |
            tr '[:upper:]' '[:lower:]')

          if [ -z "$WANT" ] && "$VENV/bin/lisa" --help >/dev/null 2>&1; then
            # Being unable to ASK what upstream is must not stop Phase 3 running
            # on the engine it already has -- the engine repo is private, so a
            # lapsed credential is a routine failure, not a reason to skip
            # validation entirely.
            echo "::warning::Could not resolve upstream LISA (${RESOLVE_ERR:-no git}); keeping the installed engine ${HAVE_SHA:-unknown}"
          elif [ -n "$WANT" ] && [ -n "$HAVE_SHA" ] \
             && "$VENV/bin/lisa" --help >/dev/null 2>&1 \
             && { [[ "$WANT" == "$HAVE_SHA"* ]] || [[ "$HAVE_SHA" == "$WANT"* ]]; }; then
            echo "LISA engine up to date at $WANT"
          else
            # Say what moved. If today's run fails and the engine changed, that
            # is the first thing to suspect -- otherwise an upstream regression
            # is indistinguishable from an AzNFS one.
            echo "::notice::LISA engine changing to ${WANT:-upstream $REF} (was: ${HAVE_SHA:-not installed})"
            # Hand over the commit we resolved, not the branch: re-resolving in
            # setup_lisa.sh could land on a different one if main moves between
            # the two lookups.
            LISA_VENV="$VENV" LISA_REF="${WANT:-$REF}" bash phase3/setup_lisa.sh
            HAVE=$("$VENV/bin/pip" freeze 2>/dev/null | grep -i mslisa || true)
            HAVE_SHA=$(printf '%s' "$HAVE" | sed -n 's/.*@\([0-9a-fA-F]\{7,40\}\).*/\1/p' |
              tr '[:upper:]' '[:lower:]')
          fi
          # What pip actually installed wins: attribution is worthless if it
          # names a commit the run did not use.
          echo "LISA_ENGINE_SHA=${HAVE_SHA:-${WANT:-unknown}}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------
      # 5. Run the Phase 3 driver: per-distro LISA validation, then record
      #    each verdict in the DB and send ONE summary e-mail.
      #
      #    The runner's USER-assigned managed identity (AZURE_CLIENT_ID) must
      #    be able to create test VMs; the system-assigned MI cannot (no RBAC).
      # ----------------------------------------------------------------
      - name: Run Phase 3 validation
        env:
          # scripts/ holds notifier.py + config.py (the ACS e-mail path, shared
          # with Phase 1/2). Phase 3's summary mail goes through notifier.notify.
          PYTHONPATH: scripts
          # --- Azure creds for the ACS e-mail notifier (shared with Phase 1/2) ---
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          # LISA (DefaultAzureCredential) and `az login --identity` BOTH default
          # to the VM's SYSTEM-assigned MI, which has NO subscription RBAC ->
          # AuthorizationFailed on Microsoft.Resources/subscriptions/read and
          # every environment fails to deploy. The Azure SDK's
          # ManagedIdentityCredential selects a USER-assigned MI only via
          # AZURE_CLIENT_ID (it ignores AZURE_MANAGED_IDENTITY_CLIENT_ID), so
          # export it here to pin both to the authorized user-assigned MI.
          AZURE_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          ACS_ENDPOINT: ${{ vars.ACS_ENDPOINT }}
          ACS_SENDER: ${{ vars.ACS_SENDER }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          # --- Shared DB ---
          DB_PATH: marketplace.db
          # --- LISA parallelism (bounded by the subscription's regional vCPU quota) ---
          LISA_VENV: ${{ vars.LISA_VENV }}
          PHASE3_CONCURRENCY: ${{ vars.PHASE3_CONCURRENCY }}
          PHASE3_MAX_PARALLEL_DISTROS: ${{ vars.PHASE3_MAX_PARALLEL_DISTROS }}
          # Pin all envs into one pre-created RG so the runner MI needs only
          # Network/Storage Account/Virtual Machine Contributor on THAT RG
          # (no subscription-scope resourcegroups/write). Driver forces
          # concurrency=1 when set. Empty => per-env RGs (needs sub-scope).
          PHASE3_RESOURCE_GROUP: ${{ vars.PHASE3_RESOURCE_GROUP }}
          # Region for the pinned RG (must match the runbook's `location`).
          PHASE3_LOCATION: ${{ vars.PHASE3_LOCATION }}
        run: |
          set -euo pipefail
          # No jobs file (e.g. Phase 2 emitted none) -> nothing to validate.
          if [ ! -s output/lisa_jobs.json ]; then
            echo "No output/lisa_jobs.json from Phase 2; nothing to validate."
            exit 0
          fi
          # Activate the LISA engine venv (path overridable via LISA_VENV).
          source "${LISA_VENV:-$HOME/lisa-venv}/bin/activate"
          # Refresh Azure auth for VM provisioning via the runner's identity.
          # Pin to the USER-assigned MI (AZURE_CLIENT_ID) - the system-assigned
          # MI has no subscription RBAC, so plain `az login --identity` would
          # authenticate as an identity that cannot deploy VMs.
          az login --identity --client-id "${AZURE_CLIENT_ID}" \
            --allow-no-subscriptions >/dev/null
          # Ensure the pinned RG exists (idempotent; no-op if already there).
          # LISA does NOT tear down a *specified* RG -- it skips deletion so it
          # cannot destroy a group it did not create, and has no per-resource
          # fallback. Nothing here is cleaned up automatically; the sweep step
          # after this one is what deletes the VMs.
          if [ -n "${PHASE3_RESOURCE_GROUP:-}" ]; then
            az group create --name "${PHASE3_RESOURCE_GROUP}" \
              --location "${PHASE3_LOCATION:-centralindia}" --output none
            echo "Ensured resource group ${PHASE3_RESOURCE_GROUP}."
          fi
          python -m phase3.run_phase3 output/lisa_jobs.json \
            --subscription-id "${AZURE_SUBSCRIPTION_ID}" \
            --concurrency "${PHASE3_CONCURRENCY:-1}" \
            --max-parallel-distros "${PHASE3_MAX_PARALLEL_DISTROS:-1}"

      # ----------------------------------------------------------------
      # 5b. Delete the VMs LISA left behind.
      # ----------------------------------------------------------------
      # LISA only ever cleans up by deleting the resource group it created, and
      # skips that for a pinned one -- so without this the group just fills up
      # with running VMs. Runs even when validation failed, because a failed run
      # still provisioned them.
      - name: Sweep Phase 3 VMs
        if: always()
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          ACS_ENDPOINT: ${{ vars.ACS_ENDPOINT }}
          ACS_SENDER: ${{ vars.ACS_SENDER }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          PHASE3_RESOURCE_GROUP: ${{ vars.PHASE3_RESOURCE_GROUP }}
          # Same venv the validation step uses -- the alert needs its packages.
          LISA_VENV: ${{ vars.LISA_VENV }}
        run: |
          set -euo pipefail
          az login --identity --client-id "${AZURE_CLIENT_ID}" \
            --allow-no-subscriptions >/dev/null
          # Phase 3 holds the only marketplace-db slot, so nothing else owns a
          # VM here and everything from this run is finished with. With no RG
          # pinned the janitor sweeps the tagged groups LISA failed to delete.
          # Built as an array so the RG name is unambiguously one argument.
          ARGS=(--older-than-hours 0 --alert)
          if [ -n "${PHASE3_RESOURCE_GROUP:-}" ]; then
            ARGS=(--resource-group "$PHASE3_RESOURCE_GROUP" "${ARGS[@]}")
          fi
          # The venv, not bare `python`: this runner has no `python` on PATH, and
          # the alert needs azure-communication-email, which only the venv has.
          PYTHONPATH=scripts "${LISA_VENV:-$HOME/lisa-venv}/bin/python" \
            scripts/vm_janitor.py "${ARGS[@]}"

      # ----------------------------------------------------------------
      # 6. Refresh the committed status page with the fresh verdicts.
      # ----------------------------------------------------------------
      - name: Publish STATUS.md
        if: always()
        run: bash .github/scripts/publish_status.sh

      # ----------------------------------------------------------------
      # 7. Persist the DB (validated-state updates) for the next run.
      # ----------------------------------------------------------------
      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: marketplace.db
          key: marketplace-db-v2-${{ github.run_id }}
