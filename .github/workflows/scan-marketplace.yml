name: Scan Marketplace Images

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Daily at 18:30 UTC.
    #
    # NOTE: deliberately NOT on the hour and NOT at midnight. GitHub's
    # `schedule` trigger is best-effort: at high-load times (every :00, and
    # 00:00 UTC most of all) queued cron runs are frequently delayed by many
    # minutes or dropped entirely. Picking an off-peak hour and an odd minute
    # makes the daily run fire reliably. If you need it at a different time,
    # keep the minute non-zero and avoid the top of popular hours.
    - cron: "30 18 * * *"
  workflow_dispatch:
    # Manual trigger from the GitHub Actions UI
    inputs:
      emit_backlog:
        description: "One-time: feed ALL unvalidated distros (the backlog) to Phase 2/3, not just the new delta"
        type: boolean
        default: false
      full_revalidation:
        description: "One-time: FORGET every verdict and re-validate the whole fleet from scratch (implies emit_backlog)"
        type: boolean
        default: false

jobs:
  scan:
    runs-on:
      - self-hosted
      - azure-vm-marketplace

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout source
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Restore the SQLite database from the previous run (if any).
      #    On the very first run there is no cache yet — that is fine;
      #    the script will create a fresh database automatically.
      # ----------------------------------------------------------------
      - name: Restore database cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: marketplace.db
          key: marketplace-db-v2-${{ github.run_id }}
          restore-keys: |
            marketplace-db-v2-

      # ----------------------------------------------------------------
      # 3. Python setup and dependency install
      # ----------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ----------------------------------------------------------------
      # 4. Run the scan.
      #    DefaultAzureCredential authenticates via the user-assigned
      #    Managed Identity attached to this self-hosted runner's VM.
      #    notifier.py uses the same MI to send the ACS email in-process,
      #    so no SMTP step is needed afterwards.
      #
      #    Exit code 1 means "new distro release(s) found" — not a
      #    failure. Anything > 1 is treated as a real failure, which must fail
      #    the job: Phase 2 only runs when this workflow concludes 'success',
      #    so swallowing a crash here would hand Phase 2 a stale artifact.
      # ----------------------------------------------------------------
      - name: Run marketplace scan
        id: scan
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          ACS_ENDPOINT: ${{ vars.ACS_ENDPOINT }}
          ACS_SENDER: ${{ vars.ACS_SENDER }}
          # One-shot backlog feed. A ticked checkbox becomes a token unique to
          # this run, so the box works EVERY time -- a fixed value like "true"
          # is consumed once and then silently ignored for ever after. Falls back
          # to the repo variable so the scheduled run can be armed too. The
          # scanner self-disables after one emit via a DB one-shot token, so a
          # forgotten variable will NOT keep re-provisioning Phase 3 VMs.
          EMIT_BACKLOG: ${{ (inputs.emit_backlog || inputs.full_revalidation) && format('manual-{0}', github.run_id) || vars.EMIT_BACKLOG }}
          # One-shot FULL re-validation: clears every tracked distro's verdict
          # back to 'unknown' once so the WHOLE fleet re-runs through Phase
          # 2/3, exactly like a first run. Ticking full_revalidation arms this
          # AND the backlog feed above, because a reset alone only marks rows
          # unknown -- the backlog is what actually hands them to Phase 2.
          RESET_VALIDATION: ${{ inputs.full_revalidation && format('manual-{0}', github.run_id) || vars.RESET_VALIDATION }}
        run: |
          cd scripts
          set +e
          python scan_marketplace.py
          scan_exit=$?
          set -e
          echo "scan_exit=$scan_exit" >> "$GITHUB_OUTPUT"
          if [ "$scan_exit" -gt 1 ]; then
            exit "$scan_exit"
          fi

      # ----------------------------------------------------------------
      # 5. The run summary (the cut-down distro list with SKU counts) is
      #    written directly by scan_marketplace.py via $GITHUB_STEP_SUMMARY,
      #    so it reflects the FULL tracked backlog every run -- not just the
      #    new/updated delta. No separate step needed here.
      # ----------------------------------------------------------------

      # ----------------------------------------------------------------
      # 6. Upload the JSON output as a workflow artifact (always, for audit)
      # ----------------------------------------------------------------
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-scan-${{ github.run_number }}
          path: |
            output/needs_validation.json
          retention-days: 30
          if-no-files-found: ignore

      # ----------------------------------------------------------------
      # 7. Save updated database to cache for the next run
      # ----------------------------------------------------------------
      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: marketplace.db
          key: marketplace-db-v2-${{ github.run_id }}
